name: Monthly MIDI 2.0 Support Status Update

on:
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run monthly update script
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/update_midi2_support_status.sh
          ./scripts/update_midi2_support_status.sh

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ja en _layouts/default.html
          git commit -m "chore: monthly MIDI 2.0 support update ($(date -u +%Y-%m-%d))"
          git push
